# This workflow will install Python dependencies, lint
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: ["trunk"]
  pull_request:
    branches: ["trunk"]

permissions:
  contents: read

jobs:
  gui-tests:

    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v3
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -Ur macOS-gui.requirements.txt
          python -m pip install -Ur dev-requirements.txt
      - name: Check
        run: |
          mypy src
      - name: Run Mac GUI tests
        run: |
          CI_MODE=YES python py2app_setup.py py2app --alias | cat
          ./dist/CiPINPal.app/Contents/MacOS/CiPINPal

  model-tests:

    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Test
        run: |
          python -m unittest discover src
